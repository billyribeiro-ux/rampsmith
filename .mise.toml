# Single installer for the local toolchain (PLAN §7, §8).
# Rust is pinned in rust-toolchain.toml and installed by rustup.
min_version = "2026.10.12"

[tools]
node = "26.12.0"
pnpm = "12.14.0"
postgres = "18.6"
"cargo:cargo-nextest" = "0.9.148"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:sqlx-cli" = { version = "0.9.0", features = "postgres,rustls", default-features = false }

[env]
# Local development database; CI and deploys set their own.
DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/rampsmith"

# ---------------------------------------------------------------------------
# Tasks. `mise run verify` is the full local gate and mirrors ci.yml (PLAN §24, §27).
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install JavaScript dependencies exactly as locked"
run = "pnpm install --frozen-lockfile"

[tasks."check:rust-fmt"]
description = "rustfmt, check only"
run = "cargo fmt --all --check"

[tasks."check:clippy"]
description = "Clippy on every target and feature, warnings are errors"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."check:cargo-deny"]
description = "Licenses, advisories, duplicate versions, sources"
run = "cargo deny --locked check"

[tasks."check:cargo-machete"]
description = "Unused Rust dependencies"
run = "cargo machete"

[tasks."check:eslint"]
description = "ESLint with zero warnings allowed"
run = "pnpm run lint"

[tasks."check:prettier"]
description = "Prettier, check only"
run = "pnpm run format:check"

[tasks."check:types"]
description = "tsc --noEmit and svelte-check --fail-on-warnings in every package"
run = "pnpm run typecheck"

[tasks."check:knip"]
description = "Unused files, exports and dependencies"
run = "pnpm run knip"

[tasks."check:claims"]
description = "Banned claims (PLAN §3) in UI strings, emails, listing and marketing copy"
run = "node packages/claims-lint/src/main.ts"

[tasks."test:rust"]
description = "Rust tests through cargo-nextest"
run = "cargo nextest run --workspace --all-features --locked"

[tasks."test:ts"]
description = "Vitest in every package"
run = "pnpm run test"

[tasks.verify]
description = "Full gate: every static check, then every test suite"
depends = ["check:*", "test:*"]
