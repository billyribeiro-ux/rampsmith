# cargo-deny: licenses, advisories, duplicate versions and sources (PLAN §8).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the gate unless listed here with a reason and an expiry.
ignore = []
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
# The allowlist is policy, not inventory: a license nobody uses yet is not a warning.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Workspace crates are proprietary and never published.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Duplicates that cannot be removed yet are listed here, each with the reason.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
