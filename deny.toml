# cargo-deny: licenses, advisories, duplicate versions and sources (PLAN §8).

[graph]
# Production runs on Linux; developers also use macOS. Windows-only crates are out of scope.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Every RustSec advisory fails the gate unless listed here with a reason and an expiry.
ignore = []
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
# The allowlist is policy, not inventory: a license nobody uses yet is not a warning.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Workspace crates are proprietary and never published.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
]
# Duplicates that cannot be removed yet, each with the reason. A version requirement keeps a
# skip valid across patch releases; a new major generation needs a fresh decision.
skip = [
  # RustCrypto's 0.10 generation, still used by sqlx-core 0.9 for SCRAM; the 0.11 generation
  # is the one PLAN §7 pins (sha2 0.11, hmac 0.13).
  { crate = "sha2@0.10", reason = "sqlx-core 0.9 depends on the RustCrypto 0.10 generation" },
  { crate = "digest@0.10", reason = "sqlx-core 0.9 depends on the RustCrypto 0.10 generation" },
  { crate = "block-buffer@0.10", reason = "sqlx-core 0.9 depends on the RustCrypto 0.10 generation" },
  { crate = "crypto-common@0.1", reason = "sqlx-core 0.9 depends on the RustCrypto 0.10 generation" },
  { crate = "cpufeatures@0.2", reason = "sqlx-core 0.9 depends on the RustCrypto 0.10 generation" },
  { crate = "getrandom@0.3", reason = "rand 0.9 (opentelemetry_sdk) depends on getrandom 0.3; sqlx and our code use rand 0.10" },
  { crate = "rand@0.9", reason = "opentelemetry_sdk 0.33 depends on rand 0.9; sqlx-postgres 0.9 and our code use rand 0.10" },
  { crate = "rand_core@0.9", reason = "comes with rand 0.9 (opentelemetry_sdk)" },
  { crate = "base64@0.22", reason = "sqlx-core 0.9 depends on base64 0.22; hyper-util (reqwest) has moved to 0.23" },
  { crate = "hashbrown@0.16", reason = "hashlink 0.11 (sqlx-core) depends on hashbrown 0.16" },
  { crate = "syn@2", reason = "most proc-macro crates have not moved to syn 3 yet" },
  { crate = "tower-http@0.6", reason = "reqwest 0.13 (OTLP exporter) depends on tower-http 0.6; the api uses 0.7 (PLAN §7)" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
