# Deploy one release to one Railway environment (PLAN §22, §24; ADR-185).
#
# Called by release.yml for staging and then production with the digests it built and verified,
# or run by hand (Actions > deploy > Run workflow, from main) to redeploy or roll back to an
# earlier release's digests. Every step that needs a founder input skips with a notice naming
# its row in LAUNCH.md section C, and the summary says what did not run: a skip is never a pass.
#
# Jobs, each holding at most one secret:
#   scope    no environment: fails if a deploy secret also exists as a repository secret.
#   check    no secret: the inputs, the release is on main, signed provenance for every image,
#            and the Node.js LTS guard on .mise.toml and on the Node.js the images ship.
#   railway  RAILWAY_TOKEN only, in the GitHub environment (production waits for the founder's
#            approval): the environment's protection, then infra/railway/railway.py in two
#            pinned-plan phases (api first, so its pre-deploy step migrates before new workers
#            start), a wait for every service to run its digest, and the public exposure check.
#   shopify  SHOPIFY_APP_AUTOMATION_TOKEN only, same environment (a second approval on
#            production): `shopify app deploy` from the committed lockfile.
#   smoke    no secret: the public smoke tests against the hosts the railway job reports.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true
      release:
        description: The commit the images were built from
        type: string
        required: true
      web-image:
        type: string
        required: true
      api-image:
        type: string
        required: true
      engine-image:
        type: string
        required: true
      egress-image:
        type: string
        required: true
      backup-image:
        type: string
        required: true
    secrets:
      # Secrets of the target GitHub environment, passed by name; they must exist only there,
      # never as repository secrets (ADR-185).
      RAILWAY_TOKEN:
        required: false
      SHOPIFY_APP_AUTOMATION_TOKEN:
        required: false
    outputs:
      deployed:
        description: true when Railway runs this release
        value: ${{ jobs.railway.outputs.deployed }}
      verified:
        description: true when the public smoke tests passed against it
        value: ${{ jobs.smoke.outputs.verified }}
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [staging, production]
        required: true
      release:
        description: Commit on main whose images to deploy (see that release run's summary)
        type: string
        required: true
      web-image:
        description: ghcr.io/billyribeiro-ux/rampsmith-web@sha256:...
        type: string
        required: true
      api-image:
        description: ghcr.io/billyribeiro-ux/rampsmith-api@sha256:...
        type: string
        required: true
      engine-image:
        description: ghcr.io/billyribeiro-ux/rampsmith-engine@sha256:...
        type: string
        required: true
      egress-image:
        description: ghcr.io/billyribeiro-ux/rampsmith-egress@sha256:...
        type: string
        required: true
      backup-image:
        description: ghcr.io/billyribeiro-ux/rampsmith-backup@sha256:...
        type: string
        required: true

permissions: read-all

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MISE_VERSION: '2026.10.12'
  PYTHON_VERSION: '3.15.0'
  RAILWAY_CLI_VERSION: '5.70.0'
  TARGET: ${{ inputs.environment }}
  RELEASE: ${{ inputs.release }}
  WEB_IMAGE: ${{ inputs.web-image }}
  API_IMAGE: ${{ inputs.api-image }}
  ENGINE_IMAGE: ${{ inputs.engine-image }}
  EGRESS_IMAGE: ${{ inputs.egress-image }}
  BACKUP_IMAGE: ${{ inputs.backup-image }}
  REPOSITORY: ${{ github.repository }}

jobs:
  scope:
    name: deploy secrets scope
    # A manual run deploys only from main's copy of this workflow (ADR-185).
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: No repository or organization copy of a deploy secret
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          # This job has no environment, so these resolve only to repository or organization
          # secrets (passed by release.yml, or read directly on a manual run). Deploy secrets
          # must be environment secrets only: a repository copy would reach every environment
          # that lacks its own (ADR-185). Only presence is checked, never printed.
          found=()
          [ -z "$RAILWAY_TOKEN" ] || found+=("RAILWAY_TOKEN (LAUNCH.md C row 8)")
          [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ] || found+=("SHOPIFY_APP_AUTOMATION_TOKEN (LAUNCH.md C row 2)")
          if [ "${#found[@]}" -gt 0 ]; then
            echo "::error title=Deploy secrets::Refusing to deploy: ${found[*]} exists as a repository or organization secret. Delete it there and keep it only as a secret of the staging and production environments."
            exit 1
          fi
          echo "No repository or organization copy of RAILWAY_TOKEN or SHOPIFY_APP_AUTOMATION_TOKEN."

  check:
    name: check ${{ inputs.environment }} release
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      lts: ${{ steps.lts.outcome }}
    steps:
      - name: Check the inputs
        run: |
          fail() { echo "::error title=deploy inputs::$*"; exit 1; }
          [[ "$TARGET" == staging || "$TARGET" == production ]] || fail "unknown environment"
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]] || fail "release must be a full commit SHA"
          for pair in "web:$WEB_IMAGE" "api:$API_IMAGE" "engine:$ENGINE_IMAGE" "egress:$EGRESS_IMAGE" "backup:$BACKUP_IMAGE"; do
            service=${pair%%:*}
            ref=${pair#*:}
            [[ "$ref" =~ ^ghcr\.io/billyribeiro-ux/rampsmith-${service}@sha256:[0-9a-f]{64}$ ]] ||
              fail "$service image must be ghcr.io/billyribeiro-ux/rampsmith-$service@sha256:<digest>"
          done
          {
            echo "## Deploy $RELEASE to $TARGET"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          fetch-depth: 0
          persist-credentials: false

      - name: The release is a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE" origin/main ||
            { echo "::error title=deploy inputs::$RELEASE is not on main"; exit 1; }
          echo "| Release on main | yes |" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Signed provenance from release.yml on main, for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version | head -1
          for ref in "$WEB_IMAGE" "$API_IMAGE" "$ENGINE_IMAGE" "$EGRESS_IMAGE" "$BACKUP_IMAGE"; do
            gh attestation verify "oci://$ref" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$RELEASE" \
              --signer-digest "$RELEASE" \
              --deny-self-hosted-runners >/dev/null
            echo "verified $ref"
          done
          echo "| Image provenance | 5 images signed by release.yml on main at $RELEASE |" >> "$GITHUB_STEP_SUMMARY"

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          # No tool cache: any job on main can write one, and these tools run next to
          # deploy secrets or decide a gate (ADR-185).
          cache: false
          install_args: node

      - name: Node version (ADR-029)
        run: |
          node --version
          node -p 'process.release.lts ?? "not an LTS release"'
          test "$(node --version)" = "v$(grep -Po '^node = "\K[^"]+' .mise.toml)"

      - name: Node.js LTS guard (.mise.toml and the images' Node.js)
        id: lts
        continue-on-error: true
        run: |
          # CLAUDE.md, ADR-016: nothing deploys before the pins move to a 26.x release tagged
          # LTS. Check the pinned binary and the Node.js inside each image that runs Node.
          status=0
          python3 infra/railway/scripts/node_lts_guard.py .mise.toml "$(mise which node)" || status=1
          for pair in "web:$WEB_IMAGE" "engine:$ENGINE_IMAGE"; do
            service=${pair%%:*}
            ref=${pair#*:}
            docker pull --quiet "$ref" >/dev/null
            wrapper="$RUNNER_TEMP/node-in-$service"
            printf '#!/bin/sh\nexec docker run --rm --network none --entrypoint node "%s" "$@"\n' "$ref" > "$wrapper"
            chmod +x "$wrapper"
            echo "$service image:"
            python3 infra/railway/scripts/node_lts_guard.py .mise.toml "$wrapper" || status=1
          done
          docker logout ghcr.io
          if [ "$status" = 0 ]; then
            echo "| Node.js LTS guard | passed: .mise.toml and the web and engine images run a 26.x LTS release |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Node.js LTS guard | **refuses** this deploy: no 26.x LTS pin yet (CLAUDE.md, ADR-016) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  railway:
    name: railway ${{ inputs.environment }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Required reviewers on `production` (LAUNCH.md C row 14) hold this job until the founder
    # approves; the protection step below refuses to continue if that rule is missing.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.RAMPSMITH_APP_HOST && format('https://{0}', vars.RAMPSMITH_APP_HOST) || '' }}
    permissions:
      contents: read
      actions: read
    outputs:
      deployed: ${{ steps.done.outputs.deployed }}
      app-host: ${{ steps.done.outputs.app-host }}
      webhook-host: ${{ steps.done.outputs.webhook-host }}
    env:
      RAMPSMITH_APP_HOST: ${{ vars.RAMPSMITH_APP_HOST }}
      RAMPSMITH_SITE_HOST: ${{ vars.RAMPSMITH_SITE_HOST }}
      RAMPSMITH_WEBHOOK_HOST: ${{ vars.RAMPSMITH_WEBHOOK_HOST }}
    steps:
      - name: Founder inputs present?
        id: inputs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Only presence is recorded, never a value.
          if [ -n "$RAILWAY_TOKEN" ]; then echo "railway=true"; else echo "railway=false"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false

      - name: Environment protection (LAUNCH.md C row 14)
        id: protection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewer=()
          if [ "$TARGET" = production ]; then reviewer=(--require-reviewer); fi
          gh api "repos/$REPOSITORY/environments/$TARGET" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$REPOSITORY/environments/$TARGET/deployment-branch-policies" \
            > "$RUNNER_TEMP/policies.json"
          python3 infra/railway/scripts/check_protection.py \
            "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json" "${reviewer[@]}"

      - name: Railway deploy skipped (LAUNCH.md C row 8)
        if: steps.inputs.outputs.railway != 'true'
        env:
          PROTECTION: ${{ steps.protection.outcome }}
          LTS: ${{ needs.check.outputs.lts }}
        run: |
          echo "::notice title=Railway deploy skipped::SKIPPED: nothing was deployed to $TARGET. The GitHub environment '$TARGET' has no RAILWAY_TOKEN secret (LAUNCH.md section C, row 8: a Railway project token for this environment)."
          echo "| Railway deploy | **skipped**: no RAILWAY_TOKEN (LAUNCH.md C row 8) |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROTECTION" != success ]; then
            echo "::notice title=Environment protection::The '$TARGET' environment is not protected yet (LAUNCH.md C row 14); a deploy with a token would be refused."
            echo "| Environment protection | not configured (LAUNCH.md C row 14): a deploy would be refused |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$LTS" != success ]; then
            echo "| Node.js LTS guard | would refuse this deploy |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refuse an unprotected environment
        if: steps.inputs.outputs.railway == 'true' && steps.protection.outcome != 'success'
        run: |
          echo "::error title=Environment protection::Refusing to deploy: the '$TARGET' GitHub environment must allow deployments from main only and, for production, require the founder's review (LAUNCH.md C row 14)."
          echo "| Environment protection | **refused** the deploy |" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Refuse to deploy before the Node.js LTS pin
        if: steps.inputs.outputs.railway == 'true' && needs.check.outputs.lts != 'success'
        run: |
          echo "::error title=Node.js LTS guard::Refusing to deploy to $TARGET: .mise.toml or an image pins a Node.js release whose process.release.lts is empty. Nothing deploys before the 26.x LTS pin (CLAUDE.md, ADR-016)."
          echo "| Node.js LTS guard | **refused** the deploy |" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.inputs.outputs.railway == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install railway-sdk (hash-pinned) and the Railway CLI (SHA-256 pinned)
        if: steps.inputs.outputs.railway == 'true'
        run: |
          python -m pip install --require-hashes -r infra/railway/requirements.txt
          bash infra/railway/tools/install_railway_cli.sh "$RUNNER_TEMP/railway-cli"
          echo "$RUNNER_TEMP/railway-cli" >> "$GITHUB_PATH"

      - name: Deploy to Railway, api first
        if: steps.inputs.outputs.railway == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          workspace=$GITHUB_WORKSPACE
          file="$workspace/infra/railway/railway.py"
          helpers="$workspace/infra/railway/scripts"
          # The CLI evaluates railway.py from this directory (python3 -c puts it on sys.path)
          # and binds every pinned plan to a hash of ./.railway, so a plan is only applied
          # from the same release's IaC.
          work="$RUNNER_TEMP/iac"
          mkdir -p "$work/.railway"
          cd "$work"
          {
            echo "$RELEASE"
            git -C "$workspace" rev-parse HEAD:infra/railway HEAD:infra/collector
          } > .railway/release
          railway --version
          jq -n --arg web "$WEB_IMAGE" --arg api "$API_IMAGE" --arg engine "$ENGINE_IMAGE" \
            --arg egress "$EGRESS_IMAGE" --arg backup "$BACKUP_IMAGE" \
            '{web: $web, api: $api, ctl: $api, engine: $engine, egress: $egress, backup: $backup}' > new.json
          # --environment must match the project token's environment, so a token stored in
          # the wrong GitHub environment fails here instead of deploying to the wrong place.
          # No --confirm-destructive: a plan that removes anything stops for a human. The plan
          # JSON stays on the runner and is never printed: railway_plan.py prints a summary.
          plan() {
            local name=$1 assignments
            mapfile -t assignments < "$name.env"
            if ! env "${assignments[@]}" railway config plan --file "$file" \
              --environment "$TARGET" --json --out "$name.plan" > "$name.json"; then
              # Show why (diagnostics and the change summary, never the graphs), then stop.
              python3 "$helpers/railway_plan.py" check "$name.json" "$name.expected.json" || true
              exit 1
            fi
          }
          apply() {
            python3 "$helpers/railway_plan.py" check "$1.json" "$1.expected.json"
            # The CLI exits 0 on a pinned apply whatever Railway reports, so read the result
            # (kept on the runner: it carries change outputs) and refuse anything but applied.
            railway config apply --plan "$1.plan" --environment "$TARGET" --yes --json \
              > "$1.applied.json"
            python3 "$helpers/railway_plan.py" applied "$1.applied.json"
          }
          since() { date -u -d '-10 seconds' +%Y-%m-%dT%H:%M:%SZ; }
          wait_for() { python3 "$helpers/wait_for_deployment.py" "$@"; }
          # What each service runs now: a probe plan at the new images, read but never applied.
          echo '{}' > none.json
          python3 "$helpers/railway_plan.py" phase none.json new.json all probe
          plan probe
          python3 "$helpers/railway_plan.py" current probe.json > current.json
          # Phase 1: the api alone; every other service keeps what it runs. The api's
          # pre-deploy step migrates, and Railway moves traffic only once /readyz passes.
          python3 "$helpers/railway_plan.py" phase current.json new.json api phase1
          plan phase1
          started=$(since)
          apply phase1
          wait_for api "$API_IMAGE" "$started" 1800
          # Phase 2: every service at this release's digests.
          python3 "$helpers/railway_plan.py" phase current.json new.json all phase2
          plan phase2
          started=$(since)
          apply phase2
          wait_for ctl "$API_IMAGE" "$started"
          wait_for egress "$EGRESS_IMAGE" "$started"
          wait_for engine "$ENGINE_IMAGE" "$started"
          wait_for web "$WEB_IMAGE" "$started"
          # The backup is a cron service (ADR-251): it runs at 02:17 UTC and exits, so Railway may
          # never report a SUCCESS deployment of its image until the first run. A miss here is
          # therefore a visible warning, not a stop; the first nightly run is checked by the
          # founder (LAUNCH.md section E, "Nightly backup service").
          wait_for backup "$BACKUP_IMAGE" "$started" 300 ||
            echo "::warning title=backup service::Railway did not report the backup image as a successful deployment within 5 minutes. It runs on its cron schedule (ADR-251); check its first run (LAUNCH.md section E)."
          collector=$(python3 -c 'import importlib.util as u, sys; s = u.spec_from_file_location("r", sys.argv[1]); m = u.module_from_spec(s); s.loader.exec_module(m); print(m.COLLECTOR_IMAGE)' "$file")
          wait_for collector "$collector" "$started"
          rm -f ./*.plan ./*.json
          echo "| Railway deploy | api, then ctl, egress, engine, web and collector run this release; the backup cron service holds its image |" >> "$GITHUB_STEP_SUMMARY"

      - name: Public exposure is exactly the listed domains (ADR-182)
        if: steps.inputs.outputs.railway == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Registers a listed domain that is missing (its DNS records appear as notices for
          # LAUNCH.md C row 10), corrects a target port, and fails on any generated domain,
          # TCP proxy or unlisted domain. It never deletes anything.
          python3 infra/railway/scripts/ensure_network.py "$TARGET" --create
          echo "| Public exposure | only the listed custom domains; no TCP proxy |" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the result
        id: done
        if: steps.inputs.outputs.railway == 'true'
        run: |
          {
            echo "deployed=true"
            echo "app-host=$RAMPSMITH_APP_HOST"
            echo "webhook-host=$RAMPSMITH_WEBHOOK_HOST"
          } >> "$GITHUB_OUTPUT"

  shopify:
    name: shopify ${{ inputs.environment }}
    needs: railway
    if: needs.railway.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The same environment, so production asks for the founder's approval again: this job
    # holds only the Shopify token, never the Railway one (ADR-185).
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false

      - name: Founder inputs present?
        id: inputs
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          # Only presence is recorded, never a value.
          if [ -n "$SHOPIFY_APP_AUTOMATION_TOKEN" ] && [ -f "shopify.app.$TARGET.toml" ]; then
            echo "deploy=true"
          else
            echo "deploy=false"
          fi >> "$GITHUB_OUTPUT"

      - name: Shopify app configuration and extension skipped (LAUNCH.md C rows 1, 2, 15)
        if: steps.inputs.outputs.deploy != 'true'
        run: |
          echo "::notice title=Shopify deploy skipped::SKIPPED: shopify app deploy did not run for $TARGET. It needs the SHOPIFY_APP_AUTOMATION_TOKEN secret in the '$TARGET' GitHub environment (LAUNCH.md C row 2; row 15 for staging's own app) and shopify.app.$TARGET.toml from 'shopify app config link' (row 1)."
          echo "| Shopify app deploy | **skipped**: needs SHOPIFY_APP_AUTOMATION_TOKEN and shopify.app.$TARGET.toml (LAUNCH.md C rows 1, 2, 15) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        if: steps.inputs.outputs.deploy == 'true'
        with:
          version: ${{ env.MISE_VERSION }}
          # No tool cache: any job on main can write one, and these tools run next to
          # deploy secrets or decide a gate (ADR-185).
          cache: false
          install_args: node

      - name: Node version (ADR-029)
        if: steps.inputs.outputs.deploy == 'true'
        run: |
          node --version
          node -p 'process.release.lts ?? "not an LTS release"'
          test "$(node --version)" = "v$(grep -Po '^node = "\K[^"]+' .mise.toml)"

      - name: Install the Shopify CLI from its lockfile, without install scripts
        if: steps.inputs.outputs.deploy == 'true'
        working-directory: infra/railway/tools/shopify-cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cli=node_modules/.bin/shopify
          "$cli" version

      - name: The app configuration subscribes to the webhook host (ADR-088)
        if: steps.inputs.outputs.deploy == 'true'
        env:
          SHOPIFY_APP_CONFIG: shopify.app.${{ inputs.environment }}.toml
          RAMPSMITH_WEBHOOK_HOST: ${{ needs.railway.outputs.webhook-host }}
        run: |
          # `shopify app config link` writes shopify.app.<env>.toml without webhook
          # subscriptions; deploying it would leave the app subscribed to nothing.
          if [ -z "$RAMPSMITH_WEBHOOK_HOST" ]; then
            echo "::error title=Webhook host::RAMPSMITH_WEBHOOK_HOST is not set, so the subscription URIs cannot be checked (LAUNCH.md C row 10)."
            exit 1
          fi
          python3 -m unittest discover -s infra/railway/tests -p 'test_shopify_app_config.py' -v
          echo "| Webhook subscriptions | $SHOPIFY_APP_CONFIG subscribes the five topics to https://$RAMPSMITH_WEBHOOK_HOST/webhooks/shopify |" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the Shopify app configuration and theme app extension
        if: steps.inputs.outputs.deploy == 'true'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.release }}
        run: |
          shopify="$GITHUB_WORKSPACE/infra/railway/tools/shopify-cli/node_modules/.bin/shopify"
          "$shopify" app deploy --config "$TARGET" --allow-updates --source-control-url "$COMMIT_URL"
          echo "| Shopify app deploy | released a new app version from shopify.app.$TARGET.toml |" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke ${{ inputs.environment }}
    needs: railway
    if: needs.railway.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      verified: ${{ steps.smoke.outputs.verified }}
    env:
      APP_HOST: ${{ needs.railway.outputs.app-host }}
      WEBHOOK_HOST: ${{ needs.railway.outputs.webhook-host }}
    steps:
      - name: Public smoke tests skipped (LAUNCH.md C row 10)
        if: env.APP_HOST == '' || env.WEBHOOK_HOST == ''
        run: |
          echo "::notice title=Smoke tests skipped::SKIPPED: the public smoke tests did not run for $TARGET, so this deploy is not verified and is not promoted. Set the RAMPSMITH_APP_HOST, RAMPSMITH_SITE_HOST and RAMPSMITH_WEBHOOK_HOST variables on the '$TARGET' GitHub environment once the domain and DNS exist (LAUNCH.md C row 10)."
          echo "| Public smoke tests | **skipped**: no RAMPSMITH_APP_HOST / RAMPSMITH_WEBHOOK_HOST (LAUNCH.md C row 10) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Public smoke tests
        id: smoke
        if: env.APP_HOST != '' && env.WEBHOOK_HOST != ''
        run: |
          host='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
          [[ "$APP_HOST" =~ $host && "$WEBHOOK_HOST" =~ $host ]] ||
            { echo "::error title=smoke test::the host variables are not host names"; exit 1; }
          check() {
            local expected=$1 method=$2 url=$3 code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" --max-time 20 \
              --retry 5 --retry-all-errors --retry-delay 5 "$url")
            [ "$code" = "$expected" ] ||
              { echo "::error title=smoke test::$method $url answered $code, expected $expected"; exit 1; }
            echo "$method $url -> $code"
          }
          check 200 GET "https://$APP_HOST/healthz"
          # The webhook host reaches only the api's webhook listener (ADR-182).
          check 404 GET "https://$WEBHOOK_HOST/readyz"
          check 404 GET "https://$WEBHOOK_HOST/healthz"
          check 401 POST "https://$WEBHOOK_HOST/webhooks/shopify"
          check 401 POST "https://$WEBHOOK_HOST/webhooks/github"
          # Plain HTTP must not serve the app (PLAN §18: HTTP redirects to HTTPS).
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://$APP_HOST/healthz")
          case "$code" in
            301 | 302 | 307 | 308) echo "http:// redirects ($code)" ;;
            *) echo "::error title=smoke test::http://$APP_HOST answered $code, expected a redirect"; exit 1 ;;
          esac
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "| Public smoke tests | passed on $APP_HOST and $WEBHOOK_HOST |" >> "$GITHUB_STEP_SUMMARY"

      - name: Synthetic install-scan-fix journey
        if: inputs.environment == 'staging'
        run: |
          # The journey arrives with the dev-store end-to-end suite (LAUNCH.md E). Until then
          # this says so plainly instead of passing.
          echo "::warning title=Synthetic journey not run::The install-scan-fix journey does not exist yet (LAUNCH.md section E, 'Staging deploy and the synthetic install-scan-fix journey'; inputs: rows 1 to 5, 8, 10). Only the smoke tests ran."
          echo "| Synthetic journey | **not run**: not built yet (LAUNCH.md E) |" >> "$GITHUB_STEP_SUMMARY"
