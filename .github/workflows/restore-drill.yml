# Restore drill (PLAN §22; ADR-175): proves that a logical backup restores into a fresh PostgreSQL 18
# with the data, the policies and the isolation it had, inside the 4-hour recovery target. The
# repository is PUBLIC, and so are this workflow's logs and artifacts: nothing a live restore
# produces (the restored cluster, the table of contents, tenant identifiers, database messages) may
# reach either (ADR-255).
#
# On every pull request that touches the backup, the drill or the migrations, and every Monday:
#   lint          ShellCheck and actionlint, pinned releases
#   drill         migrate, seed two tenants, back up, restore, verify, time it; then the negative
#                 cases that must make it fail; then the restore path for a real backup
#   backup-tests  the backup scripts end to end against a throwaway database, the SQL files the
#                 runbooks tell an operator to run (docs/runbooks/sql, ADR-178), and the checks of
#                 the live drill's environment
#   live          weekly and on demand, on main only: restore the newest real staging backup
#
# The nightly backup itself is not here. It is the Railway cron service `backup` (ADR-251) of each
# environment, and GitHub holds no credential that can write a backup. Each environment has its own
# R2 bucket and its own write token, held as sealed variables of that environment's service only, so
# a leak in staging cannot reach production's backups (ADR-252); the key that signs each backup's
# metadata is held there too, and the public key that verifies it is committed under
# infra/backup/signing/ (ADR-256).
#
# The live drill is the only job that reads a backup credential, and only the drill's own
# (ADR-252, ADR-253): a read-only R2 token on the STAGING bucket and the offline age key, as secrets
# of the GitHub environment `backup-drill` and of nothing else. It is a chain of jobs, so that no
# step that can read those secrets starts before the environment has been checked:
#   drill-scope       no environment, no permissions: fails if any backup or drill secret exists
#                     as a repository or organization secret, where every job of every workflow
#                     (and a pull request's) could read it
#   drill-protection  no environment, no secrets: fails unless `backup-drill` exists and deploys
#                     from main only (infra/restore-drill/check_environment.py)
#   drill-strays      no environment, no secrets: fails if the unprotected environments that the
#                     deleted backup workflow created (`backup-production`, `backup-staging`) exist
#   live              `environment: backup-drill`; needs the three jobs above
#   live-skipped      when the repository variable BACKUP_DRILL_READY is not `true`: a warning
#                     that names LAUNCH.md section C row 16. The job `live` is skipped, and a
#                     skipped job reaches no secret.
#
# Every container is the pinned PostgreSQL image, run without a network.
name: restore-drill

on:
  pull_request:
    paths:
      - infra/restore-drill/**
      - infra/backup/**
      - docs/runbooks/**
      - crates/db/migrations/**
      - .github/workflows/restore-drill.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: restore-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # postgres:18.6-bookworm, index digest read from Docker Hub on 2026-10-17 (same as ci.yml).
  RD_IMAGE: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
  # age v1.3.2 (FiloSottile/age release asset); the SHA-256 was computed on 2026-10-19.
  AGE_VERSION: v1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  # ShellCheck v0.11.0 and actionlint 1.7.12 release assets, SHA-256 from the release pages.
  SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck and actionlint (pinned releases, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/lint"
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/dl/shellcheck.txz" "$SHELLCHECK_URL"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/dl/shellcheck.txz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/dl/shellcheck.txz" -C "$RUNNER_TEMP/lint" --strip-components=1 shellcheck-v0.11.0/shellcheck
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/dl/actionlint.tgz" "$ACTIONLINT_URL"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/dl/actionlint.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dl/actionlint.tgz" -C "$RUNNER_TEMP/lint" actionlint
          echo "$RUNNER_TEMP/lint" >>"$GITHUB_PATH"
      - name: ShellCheck (no findings at any severity)
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR infra/restore-drill/*.sh infra/restore-drill/tests/*.sh \
            infra/backup/*.sh infra/backup/lib/*.sh infra/backup/tests/*.sh infra/backup/signing/*.sh
      - name: actionlint (runs ShellCheck on the workflow scripts too)
        run: |
          actionlint -version
          actionlint .github/workflows/restore-drill.yml

  drill:
    name: drill
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age (pinned release, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/tools"
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/dl/age.tgz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/dl/age.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dl/age.tgz" -C "$RUNNER_TEMP/tools" --strip-components=1 age/age age/age-keygen
          "$RUNNER_TEMP/tools/age" --version
          echo "RD_TOOLS=$RUNNER_TEMP/tools" >>"$GITHUB_ENV"
          echo "RD_SCRATCH=$RUNNER_TEMP/scratch" >>"$GITHUB_ENV"
      - name: Pull the pinned PostgreSQL image
        run: |
          docker pull --quiet "$RD_IMAGE"
          docker run --rm "$RD_IMAGE" postgres --version
      - name: Restore drill (control run)
        run: |
          infra/restore-drill/in-container.sh bash infra/restore-drill/drill.sh \
            --work /scratch/work --keep --out /scratch/drill
      - name: Restore path of a real backup, on the drill's own archive
        run: |
          archive=$(cd "$RD_SCRATCH/work/s3" && find . -path '*/daily/*' -name '*.dump.age' | head -n 1)
          archive=${archive#./}
          infra/restore-drill/in-container.sh bash infra/restore-drill/restore-local.sh \
            --file "/scratch/work/s3/$archive" --identity /scratch/work/drill.key \
            --out /scratch/restore-local --work /scratch/restore-local-work --min-tenants 2
      - name: Remove the throwaway keys and plaintext archives
        if: always()
        run: infra/restore-drill/in-container.sh rm -rf /scratch/work /scratch/restore-local-work
      - name: Negative cases (the drill must fail on each injected fault)
        run: |
          infra/restore-drill/in-container.sh bash infra/restore-drill/tests/negative.sh \
            --out /scratch/negative
      - name: Summary
        if: always()
        run: |
          {
            echo "### Restore drill"
            echo
            echo '```'
            cat "$RD_SCRATCH/drill/result.txt" "$RD_SCRATCH/drill/timings.tsv" 2>/dev/null || true
            grep -h '^\(rto\|PASS\|FAIL\)' "$RD_SCRATCH/drill/verify-full.txt" 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the drill report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-report
          path: |
            ${{ runner.temp }}/scratch/drill
            ${{ runner.temp }}/scratch/restore-local
            ${{ runner.temp }}/scratch/negative/*.txt
          retention-days: 30
          if-no-files-found: warn

  backup-tests:
    name: backup-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age (pinned release, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/tools"
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/dl/age.tgz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/dl/age.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dl/age.tgz" -C "$RUNNER_TEMP/tools" --strip-components=1 age/age age/age-keygen
          echo "RD_TOOLS=$RUNNER_TEMP/tools" >>"$GITHUB_ENV"
          echo "RD_SCRATCH=$RUNNER_TEMP/scratch" >>"$GITHUB_ENV"
      - name: Pull the pinned PostgreSQL image
        run: docker pull --quiet "$RD_IMAGE"
      - name: Backup tests (names, retention, signatures, skip and failure paths, the R2 tokens, the drill's hand-off, the runbooks)
        run: |
          set -o pipefail
          rc=0
          infra/restore-drill/in-container.sh bash infra/backup/tests/run.sh --out /scratch/backup-tests 2>&1 | tee "$RUNNER_TEMP/backup-tests.log" || rc=$?
          # Name each failed check as an annotation, so a failure can be read without the log.
          grep -E -A5 '^FAIL' "$RUNNER_TEMP/backup-tests.log" | cut -c1-300 | head -60 | while IFS= read -r line; do echo "::error title=backup test::${line}"; done
          exit "$rc"
      - name: Runbook SQL (the statements the runbooks tell an operator to run, on a migrated database)
        run: |
          infra/restore-drill/in-container.sh bash infra/restore-drill/tests/runbook-sql.sh --out /scratch/backup-tests/runbook-sql
      - name: Drill environment check (unit tests, recorded GitHub settings)
        run: python3 -B -m unittest discover -s infra/restore-drill/tests -p 'test_*.py' -v
      - name: Show the skip notices of the backup service and the live drill (no secrets here)
        # The scripts the Railway service and the weekly live drill run first, with nothing
        # configured: each must announce its skip, name LAUNCH.md section C row 16, and exit 0.
        # The annotations appear on this run.
        run: |
          set -euo pipefail
          env -i PATH="$PATH" BACKUP_ENVIRONMENT=staging infra/backup/entrypoint.sh 2>&1 | tee "$RUNNER_TEMP/backup.txt"
          grep -q 'LAUNCH.md section C row 16' "$RUNNER_TEMP/backup.txt"
          env -i PATH="$PATH" infra/restore-drill/live.sh --environment staging 2>&1 | tee "$RUNNER_TEMP/live.txt"
          grep -q 'live restore drill skipped' "$RUNNER_TEMP/live.txt"
          grep -q 'LAUNCH.md section C row 16' "$RUNNER_TEMP/live.txt"
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-tests-log
          path: ${{ runner.temp }}/scratch/backup-tests
          retention-days: 30
          if-no-files-found: warn

  drill-scope:
    name: drill secrets scope
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: No repository or organization copy of a backup or drill secret
        env:
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          BACKUP_SIGNING_KEY: ${{ secrets.BACKUP_SIGNING_KEY }}
          DRILL_R2_ACCESS_KEY_ID: ${{ secrets.DRILL_R2_ACCESS_KEY_ID }}
          DRILL_R2_SECRET_ACCESS_KEY: ${{ secrets.DRILL_R2_SECRET_ACCESS_KEY }}
          BACKUP_DRILL_AGE_KEY: ${{ secrets.BACKUP_DRILL_AGE_KEY }}
          # Names the earlier design used (a GitHub-hosted backup, the engine's R2 token, an SSH
          # key and a Railway token for the backup): none of them belongs here any more.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.BACKUP_RAILWAY_SSH_PRIVATE_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          # This job has no environment, so these resolve only to repository or organization
          # secrets. The backup credentials live in Railway, the drill's in the `backup-drill`
          # environment, and a repository copy would reach every workflow and every job (ADR-253).
          # Only presence is checked, never printed.
          found=()
          [ -z "$BACKUP_R2_ACCESS_KEY_ID" ] || found+=("BACKUP_R2_ACCESS_KEY_ID")
          [ -z "$BACKUP_R2_SECRET_ACCESS_KEY" ] || found+=("BACKUP_R2_SECRET_ACCESS_KEY")
          [ -z "$BACKUP_DB_PASSWORD" ] || found+=("BACKUP_DB_PASSWORD")
          [ -z "$BACKUP_SIGNING_KEY" ] || found+=("BACKUP_SIGNING_KEY")
          [ -z "$DRILL_R2_ACCESS_KEY_ID" ] || found+=("DRILL_R2_ACCESS_KEY_ID")
          [ -z "$DRILL_R2_SECRET_ACCESS_KEY" ] || found+=("DRILL_R2_SECRET_ACCESS_KEY")
          [ -z "$BACKUP_DRILL_AGE_KEY" ] || found+=("BACKUP_DRILL_AGE_KEY")
          [ -z "$R2_ACCESS_KEY_ID" ] || found+=("R2_ACCESS_KEY_ID")
          [ -z "$R2_SECRET_ACCESS_KEY" ] || found+=("R2_SECRET_ACCESS_KEY")
          [ -z "$BACKUP_RAILWAY_SSH_PRIVATE_KEY" ] || found+=("BACKUP_RAILWAY_SSH_PRIVATE_KEY")
          [ -z "$RAILWAY_API_TOKEN" ] || found+=("RAILWAY_API_TOKEN")
          if [ "${#found[@]}" -gt 0 ]; then
            echo "::error title=Backup secrets::Refusing to run the live restore drill: ${found[*]} exists as a repository or organization secret. Delete it there. The backup credentials are Railway variables of the backup service; the drill's are secrets of the backup-drill environment only (LAUNCH.md section C row 16)."
            exit 1
          fi
          echo "No repository or organization copy of a backup or drill secret."

  drill-protection:
    name: drill environment protection
    needs: drill-scope
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BACKUP_DRILL_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GET .../environments/{name} and .../deployment-branch-policies need "Actions: read"
    # (GitHub REST documentation; ADR-253). This job has no environment and holds no secret.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The backup-drill environment deploys from main only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/environments/backup-drill" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$REPOSITORY/environments/backup-drill/deployment-branch-policies" \
            > "$RUNNER_TEMP/policies.json"
          python3 infra/restore-drill/check_environment.py \
            "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json"

  drill-strays:
    name: no stray backup environments
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GET /repos/{owner}/{repo}/environments is listed under "Actions: read" for fine-grained
    # tokens (GitHub REST documentation); if the workflow token is refused, the job warns instead
    # of failing, because a refusal says nothing about the environments.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The environments of the deleted backup workflow do not exist (ADR-259)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          # The first backup design ran as a workflow in `backup-production` and `backup-staging`.
          # GitHub creates an environment, unprotected, the first time a workflow names one that
          # does not exist, so those two may exist. Nothing names them now; they must go.
          if ! gh api "repos/$REPOSITORY/environments?per_page=100" > "$RUNNER_TEMP/environments.json" 2> "$RUNNER_TEMP/environments.err"; then
            echo "::warning title=Stray environments not checked::The workflow token cannot list the repository's environments, so this run did not check that backup-production and backup-staging are gone. Delete them by hand if they exist (LAUNCH.md section C row 16): $(tr '\n' ' ' < "$RUNNER_TEMP/environments.err" | head -c 200)"
            exit 0
          fi
          python3 -B infra/restore-drill/check_environment.py --stray "$RUNNER_TEMP/environments.json"

  live-skipped:
    name: live restore skipped
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BACKUP_DRILL_READY != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Announce the skip
        run: |
          echo "::warning title=live restore drill skipped::The repository variable BACKUP_DRILL_READY is not 'true', so the weekly restore of the newest real staging backup did not run, and no backup was verified. It needs LAUNCH.md section C row 16 (the backup-drill environment with the drill's read-only R2 token and the offline age key); the check is the row 'Live restore drill' in LAUNCH.md section E."
          {
            echo "### Live restore drill: skipped"
            echo
            echo "BACKUP_DRILL_READY is not true. Needs LAUNCH.md section C row 16; tracked in section E."
          } >>"$GITHUB_STEP_SUMMARY"

  live:
    name: live restore (staging)
    needs: [drill-scope, drill-protection, drill-strays]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BACKUP_DRILL_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The only job that can read a backup credential. `backup-drill` is limited to main and has
    # no required reviewer (the drill is scheduled); `needs` above is what proves both.
    environment: backup-drill
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age (pinned release, SHA-256 checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/tools"
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/dl/age.tgz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/dl/age.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dl/age.tgz" -C "$RUNNER_TEMP/tools" --strip-components=1 age/age age/age-keygen
          echo "RD_TOOLS=$RUNNER_TEMP/tools" >>"$GITHUB_ENV"
      - name: Pull the pinned PostgreSQL image
        run: docker pull --quiet "$RD_IMAGE"
      - name: Restore the newest staging backup (read-only token on the staging bucket; the key reaches the container by name)
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_BACKUPS: ${{ vars.R2_BUCKET_BACKUPS }}
          DRILL_R2_ACCESS_KEY_ID: ${{ secrets.DRILL_R2_ACCESS_KEY_ID }}
          DRILL_R2_SECRET_ACCESS_KEY: ${{ secrets.DRILL_R2_SECRET_ACCESS_KEY }}
          BACKUP_DRILL_AGE_KEY: ${{ secrets.BACKUP_DRILL_AGE_KEY }}
        run: infra/restore-drill/live.sh --environment staging --scratch "$RUNNER_TEMP/live"
      - name: Upload the live drill summary (the only file; the repository is public)
        # live.sh writes report/summary.txt with fixed fields: the result, the backup's date, times
        # and counts. Never upload `out`, `work` or `log`: they are the restore's working files, and
        # the restored cluster is customer data (finding HIGH-1, ADR-255). The restored cluster is
        # not on the runner at all: it is made in the container's own /tmp and deleted there.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-restore-summary
          path: ${{ runner.temp }}/live/report/summary.txt
          retention-days: 30
          if-no-files-found: ignore
