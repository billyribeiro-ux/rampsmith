# Release pipeline (PLAN §24, ADR-185). On every push to main: build each image once and push it
# to GHCR with signed SLSA build provenance (`publish`, the only job that can write packages or
# sign); then, with read-only permissions, verify that provenance, record a CycloneDX SBOM, scan
# for vulnerabilities and start the pushed digest the way Railway will (`verify`); deploy those
# digests to staging; promote the same digests to production behind the protected `production`
# environment.
#
# On a pull request that touches deployment files it runs the same checks as a dry run: images
# are built and smoke-tested locally, nothing is pushed, signed or deployed.
#
# Every action is pinned to a full commit SHA (tag in the trailing comment), every image by
# digest, every tool by version and, where it is downloaded, by hash.
name: release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - infra/railway/**
      - infra/collector/**
      - infra/*.Dockerfile
      - infra/backup/**
      - crates/db/migrations/**
      - .github/workflows/release.yml
      - .github/workflows/deploy.yml
      - .mise.toml

permissions: read-all

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  # A release in progress on main is never cancelled; a newer push queues behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: '2026.10.12'
  PYTHON_VERSION: '3.15.0'
  GO_VERSION: '1.27.2'
  ACTIONLINT_VERSION: 'v1.7.12'
  REGISTRY: ghcr.io/billyribeiro-ux
  # The BuildKit daemon that builds (and, in `publish`, produces the bytes that are signed):
  # moby/buildkit v0.34.0 (7 Oct 2026), index digest read from Docker Hub by this workflow on
  # 18 Oct 2026 (run 39096492374), instead of setup-buildx-action's floating default.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
  # The disposable database the smoke tests use (same image and digest as ci.yml).
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: rampsmith

jobs:
  config:
    name: deploy config
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install railway-sdk and shellcheck (hash-pinned)
        run: |
          python -m pip install --require-hashes \
            -r infra/railway/requirements.txt -r infra/railway/requirements-ci.txt
      - name: Railway IaC and deploy helper tests
        run: python -m unittest discover -s infra/railway/tests -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install actionlint (Go module checksums verified by sum.golang.org)
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: actionlint (with shellcheck)
        run: |
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color \
            .github/workflows/release.yml .github/workflows/deploy.yml
      - name: shellcheck the deploy scripts
        run: shellcheck infra/railway/tests/*.sh infra/railway/tools/*.sh
      - name: The Railway CLI pin matches GitHub's record of the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r sum asset < infra/railway/tools/railway-cli.sha256
          version=${asset#railway-v}
          version=${version%%-*}
          recorded=$(gh api "repos/railwayapp/cli/releases/tags/v$version" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          if [ "$recorded" != "sha256:$sum" ]; then
            echo "::error title=Railway CLI pin::$asset is recorded as '$recorded' by GitHub, but infra/railway/tools/railway-cli.sha256 pins sha256:$sum"
            exit 1
          fi
          grep -qx "  RAILWAY_CLI_VERSION: '$version'" .github/workflows/deploy.yml ||
            { echo "::error title=Railway CLI pin::deploy.yml does not name Railway CLI $version"; exit 1; }
          bash infra/railway/tools/install_railway_cli.sh "$RUNNER_TEMP/railway-cli"
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          # No tool cache: any job on main can write one, and these tools run next to
          # deploy secrets or decide a gate (ADR-185).
          cache: false
          install_args: node
      - name: The Shopify CLI installs from its lockfile without install scripts
        working-directory: infra/railway/tools/shopify-cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          wanted=$(node -p 'require("./package.json").dependencies["@shopify/cli"]')
          cli=node_modules/.bin/shopify
          installed=$("$cli" version)
          [ "$installed" = "$wanted" ] ||
            { echo "::error title=Shopify CLI::lockfile installs $installed, package.json pins $wanted"; exit 1; }
          echo "Shopify CLI $installed"
      - name: Node.js LTS guard against real binaries
        run: |
          # The guard must agree with the pinned binary: it refuses 26.12.0 (Current) and
          # accepts a 26.x release tagged LTS.
          lts=$(node -p 'process.release.lts ?? ""')
          if python infra/railway/scripts/node_lts_guard.py .mise.toml "$(mise which node)"; then
            result=passes
          else
            result=refuses
          fi
          if [ -n "$lts" ]; then expected=passes; else expected=refuses; fi
          test "$result" = "$expected"
          # A real LTS binary of another line: the LTS check accepts it, and the line check
          # refuses it, because ADR-016 fixes the line at 26.
          mise install node@24.22.0
          printf '[tools]\nnode = "24.22.0"\n' > "$RUNNER_TEMP/lts.mise.toml"
          python - "$RUNNER_TEMP/lts.mise.toml" "$(mise where node@24.22.0)/bin/node" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "guard", "infra/railway/scripts/node_lts_guard.py"
          )
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          ok, message = guard.check(Path(sys.argv[1]), sys.argv[2], major=24)
          if not ok:
              sys.exit(f"an LTS binary was refused: {message}")
          ok, message = guard.check(Path(sys.argv[1]), sys.argv[2])
          if ok or "not a 26.x release" not in message:
              sys.exit(f"the guard did not hold the 26 line: {message}")
          print("The guard accepts a real LTS binary and holds the 26.x line.")
          PY
          echo "::notice title=Node.js LTS guard::The guard $result deploys on the current pin ($(node --version))."

  collector:
    name: collector config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install railway-sdk (hash-pinned)
        run: python -m pip install --require-hashes -r infra/railway/requirements.txt
      - name: Validate and smoke-test the collector config with the pinned image
        run: |
          image=$(python -c 'import importlib.util as u; s = u.spec_from_file_location("r", "infra/railway/railway.py"); m = u.module_from_spec(s); s.loader.exec_module(m); print(m.COLLECTOR_IMAGE)')
          docker pull "$image"
          python infra/collector/tests/smoke.py "$image"

  # Pull requests: build and smoke-test each image locally; nothing leaves the runner.
  images:
    name: image ${{ matrix.service }} (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: &images
          - { service: web, dockerfile: infra/web.Dockerfile }
          - { service: api, dockerfile: infra/api.Dockerfile }
          - { service: engine, dockerfile: infra/engine.Dockerfile }
          - { service: egress, dockerfile: infra/egress.Dockerfile }
          # The nightly backup's cron service (ADR-090) keeps its image beside its scripts.
          - { service: backup, dockerfile: infra/backup/Dockerfile }
    services:
      postgres:
        # postgres:18.6-bookworm, index digest read from Docker Hub on 2026-10-17 (ci.yml).
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rampsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rampsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SERVICE: ${{ matrix.service }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the Dockerfile
        id: dockerfile
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=image $SERVICE::$DOCKERFILE does not exist yet (main builder); a release on main fails until it does."
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.dockerfile.outputs.present == 'true'
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false
      - name: Build the image
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
          tags: rampsmith-${{ matrix.service }}:dry-run
          cache-from: type=gha,scope=${{ matrix.service }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.dockerfile.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install railway-sdk (hash-pinned)
        if: steps.dockerfile.outputs.present == 'true'
        run: python -m pip install --require-hashes -r infra/railway/requirements.txt
      - name: Install the Rust toolchain for sqlx-cli
        if: steps.dockerfile.outputs.present == 'true' && (matrix.service == 'api' || matrix.service == 'engine')
        run: rustup toolchain install
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        if: steps.dockerfile.outputs.present == 'true' && (matrix.service == 'api' || matrix.service == 'engine')
        with:
          version: ${{ env.MISE_VERSION }}
          # No tool cache: any job on main can write one, and these tools run next to
          # deploy secrets or decide a gate (ADR-185).
          cache: false
          install_args: cargo-binstall cargo:sqlx-cli
      - name: Database logins from bootstrap.sql
        if: steps.dockerfile.outputs.present == 'true' && matrix.service == 'api'
        run: bash infra/railway/tests/bootstrap_test.sh
      - name: Smoke test, as Railway starts it
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          bash infra/railway/tests/image_smoke.sh "$SERVICE" "rampsmith-$SERVICE:dry-run"
          if [ "$SERVICE" = api ]; then
            bash infra/railway/tests/image_smoke.sh ctl rampsmith-api:dry-run
          fi

  # main: build once, push, sign. Nothing else runs while this job can write packages or mint
  # an OIDC token (ADR-185): no scanner, no SBOM tool, no image is started here.
  publish:
    name: publish ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include: *images
    env:
      SERVICE: ${{ matrix.service }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the Dockerfile
        run: |
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error title=image $SERVICE::$DOCKERFILE does not exist, so this commit cannot be released."
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # One plain image manifest per service; provenance is attached below as a signed
          # attestation instead of an unsigned BuildKit one.
          provenance: false
          sbom: false
          # The version label is part of the image, so a variable change on Railway can never
          # label an old image with a new release.
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/rampsmith-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$DIGEST'"; exit 1; }
      - name: Signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/rampsmith-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
      - name: Record the image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release
          echo "$REGISTRY/rampsmith-$SERVICE@$DIGEST" > "release/$SERVICE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: release/${{ matrix.service }}
          retention-days: 90
          if-no-files-found: error

  # main, read-only: verify the signature, SBOM, scan and smoke-test the pushed digest.
  verify:
    name: verify ${{ matrix.service }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: true
      matrix:
        service: [web, api, engine, egress, backup]
    services:
      postgres:
        # postgres:18.6-bookworm, index digest read from Docker Hub on 2026-10-17 (ci.yml).
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rampsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rampsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SERVICE: ${{ matrix.service }}
      STRICT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
          path: release
      - name: Read the image reference
        id: ref
        run: |
          ref=$(cat "release/$SERVICE")
          [[ "$ref" =~ ^${REGISTRY}/rampsmith-${SERVICE}@sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::bad image reference for $SERVICE"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Signed provenance from this workflow, on main, for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ github.sha }}
        run: |
          gh attestation verify "oci://$REF" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "$RELEASE" \
            --signer-digest "$RELEASE" \
            --deny-self-hosted-runners >/dev/null
          echo "verified $REF"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.ref }}
          format: cyclonedx-json
          output-file: ${{ matrix.service }}.cdx.json
          upload-artifact: false
          syft-version: v1.54.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: ${{ matrix.service }}.cdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Vulnerabilities (fail on fixable high or critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.ref.outputs.ref }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.120.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install railway-sdk (hash-pinned)
        run: python -m pip install --require-hashes -r infra/railway/requirements.txt
      - name: Install the Rust toolchain for sqlx-cli
        if: matrix.service == 'api' || matrix.service == 'engine'
        run: rustup toolchain install
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        if: matrix.service == 'api' || matrix.service == 'engine'
        with:
          version: ${{ env.MISE_VERSION }}
          # No tool cache: any job on main can write one, and these tools run next to
          # deploy secrets or decide a gate (ADR-185).
          cache: false
          install_args: cargo-binstall cargo:sqlx-cli
      - name: Smoke test the pushed digest, as Railway starts it
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          docker pull "$REF"
          bash infra/railway/tests/image_smoke.sh "$SERVICE" "$REF"
          if [ "$SERVICE" = api ]; then
            bash infra/railway/tests/image_smoke.sh ctl "$REF"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-${{ matrix.service }}
          path: release/${{ matrix.service }}
          retention-days: 90
          if-no-files-found: error

  manifest:
    name: release manifest
    needs: [config, collector, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.read.outputs.web }}
      api: ${{ steps.read.outputs.api }}
      engine: ${{ steps.read.outputs.engine }}
      egress: ${{ steps.read.outputs.egress }}
      backup: ${{ steps.read.outputs.backup }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verified-*
          path: release
      - name: Read the verified digests
        id: read
        run: |
          # Exactly the five verify jobs' artifacts, each in its own directory: an extra or a
          # missing one stops the release instead of overwriting a verified digest.
          found=$(find release -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')
          [ "$found" = "verified-api verified-backup verified-egress verified-engine verified-web " ] ||
            { echo "::error::unexpected release artifacts: $found"; exit 1; }
          echo "## Release ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          for service in web api engine egress backup; do
            ref=$(cat "release/verified-$service/$service")
            [[ "$ref" =~ ^${REGISTRY}/rampsmith-${service}@sha256:[0-9a-f]{64}$ ]] ||
              { echo "::error::bad image reference for $service"; exit 1; }
            echo "$service=$ref" >> "$GITHUB_OUTPUT"
            echo "- \`$service\`: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          done

  staging:
    name: staging
    needs: manifest
    # A called workflow may not ask for more than its caller grants; deploy.yml's jobs narrow
    # this to what each one uses.
    permissions: read-all
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      release: ${{ github.sha }}
      web-image: ${{ needs.manifest.outputs.web }}
      api-image: ${{ needs.manifest.outputs.api }}
      engine-image: ${{ needs.manifest.outputs.engine }}
      egress-image: ${{ needs.manifest.outputs.egress }}
      backup-image: ${{ needs.manifest.outputs.backup }}
    # Passed by name, as GitHub requires: each exists only as a secret of the `staging`
    # environment, which takes precedence inside deploy.yml's environment jobs.
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}

  production:
    name: production
    needs: [manifest, staging]
    # Promotion needs a staging deploy that ran and passed its smoke tests: a skipped one (no
    # Railway token or no hosts yet) never promotes.
    if: needs.staging.outputs.verified == 'true'
    permissions: read-all
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      release: ${{ github.sha }}
      web-image: ${{ needs.manifest.outputs.web }}
      api-image: ${{ needs.manifest.outputs.api }}
      engine-image: ${{ needs.manifest.outputs.engine }}
      egress-image: ${{ needs.manifest.outputs.egress }}
      backup-image: ${{ needs.manifest.outputs.backup }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
