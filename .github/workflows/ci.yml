# Pull-request gate (PLAN §24). Every job is required; every action is pinned to a full
# commit SHA (the tag is in the trailing comment); every image is pinned by digest.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NEXTEST_PROFILE: ci
  # The PostgreSQL 18.6 service container replaces the mise-managed local server in CI.
  MISE_DISABLE_TOOLS: postgres
  # Each job installs exactly the tools it needs; nothing is installed implicitly.
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  MISE_VERSION: '2026.10.12'

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        # postgres:18.6-bookworm, index digest read from Docker Hub on 2026-10-17.
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rampsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rampsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rampsmith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: cargo-binstall cargo:cargo-nextest cargo:cargo-deny cargo:cargo-machete cargo:sqlx-cli
      - name: rustfmt
        run: mise run check:rust-fmt
      - name: Clippy (-D warnings)
        shell: bash
        run: |
          set -o pipefail
          mise run check:clippy 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Report Clippy's errors as annotations
        if: failure()
        shell: bash
        run: |
          # The job log host is unreachable from the build sessions; this makes the failure
          # readable through the check-run annotations API.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' "$RUNNER_TEMP/clippy.log" |
            grep -E -A8 '(^|\] )error(\[|:)' | grep -vE 'Compiling|Checking' |
            head -n 60 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$RUNNER_TEMP/clippy.tail"
          echo "::error title=Clippy errors (first 60 lines)::$(cat "$RUNNER_TEMP/clippy.tail")"
      - name: cargo-deny
        run: mise run check:cargo-deny
      - name: cargo-machete
        run: mise run check:cargo-machete
      - name: sqlx offline data matches the migrated schema
        run: mise run check:sqlx
      - name: Tests (cargo-nextest, PostgreSQL 18.6)
        run: mise run test:rust

  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        # Same image and digest as the rust job: the TypeScript queue tests need a database.
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rampsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rampsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rampsmith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node pnpm
      - name: Node version (ADR-029)
        run: |
          node --version
          node -p 'process.release.lts ?? "not an LTS release"'
          test "$(node --version)" = "v$(grep -Po '^node = "\K[^"]+' .mise.toml)"
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies (frozen lockfile)
        run: mise run setup
      - name: ESLint (zero warnings)
        run: mise run check:eslint
      - name: Prettier
        run: mise run check:prettier
      - name: tsc and svelte-check
        run: mise run check:types
      - name: knip
        run: mise run check:knip
      - name: claims-lint (PLAN §3)
        run: mise run check:claims
      - name: Node.js pins agree with .mise.toml (ADR-029)
        run: mise run check:node-pins
      - name: Tests (Vitest, PostgreSQL 18.6)
        run: mise run test:ts

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # Same image and digest as the rust job: the dashboard tests run the real api.
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rampsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rampsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rampsmith
      PGHOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node pnpm
      - name: Node version (ADR-029)
        run: |
          node --version
          node -p 'process.release.lts ?? "not an LTS release"'
          test "$(node --version)" = "v$(grep -Po '^node = "\K[^"]+' .mise.toml)"
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies (frozen lockfile)
        run: mise run setup
      - name: Install Playwright's pinned Chromium
        run: pnpm --filter @rampsmith/web exec playwright install --with-deps chromium
      - name: Browser tests (axe, keyboard; real api and database for the dashboard)
        run: mise run test:e2e
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node pnpm
      - name: Node version (ADR-029)
        run: |
          node --version
          node -p 'process.release.lts ?? "not an LTS release"'
          test "$(node --version)" = "v$(grep -Po '^node = "\K[^"]+' .mise.toml)"
      - name: Install dependencies (frozen lockfile)
        run: mise run setup
      - name: Contract drift (regenerate and diff)
        run: mise run check:contracts

  images:
    # One image per deployable (PLAN §22, §24 step 6; ADR-016, ADR-028): build, smoke-test,
    # SBOM, and fail on fixable high or critical vulnerabilities.
    name: images (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, egress, engine, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          load: true
          push: false
          provenance: false
          tags: rampsmith-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test
        run: infra/smoke/${{ matrix.image }}.sh rampsmith-${{ matrix.image }}:ci
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rampsmith-${{ matrix.image }}:ci
          format: cyclonedx-json
          output-file: ${{ matrix.image }}.cdx.json
          artifact-name: ${{ matrix.image }}.cdx.json
          syft-version: v1.54.1
      - name: Vulnerabilities (fail on fixable high or critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rampsmith-${{ matrix.image }}:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.120.1
