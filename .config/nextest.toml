# cargo-nextest configuration. Retries stay at zero: a flaky test is a bug to fix,
# never something to re-run until green (PLAN §27).
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"

# The R0 live dev-store check (ADR-031) passes without inputs by printing a notice that names
# them. nextest hides the output of a passing test, so show this binary's output as soon as each
# test finishes: the notice (a GitHub Actions annotation in CI) must never go unseen. Overrides
# in the default profile apply to every other profile too, `ci` included.
[[profile.default.overrides]]
filter = 'binary(live_dev_store)'
success-output = "immediate"
