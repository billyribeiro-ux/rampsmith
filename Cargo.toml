[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/billyribeiro-ux/rampsmith"

# Versions were read from crates.io on 2026-10-17 (docs/evidence/versions-2026-10-17.md).
# Cargo.lock pins the exact resolution; add a crate here only when a member uses it.
[workspace.dependencies]
contracts = { package = "rampsmith-contracts", path = "crates/contracts" }
domain = { package = "rampsmith-domain", path = "crates/domain" }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
queue = { package = "rampsmith-queue", path = "crates/queue" }
rand = "0.10.3"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time", "json"] }
telemetry = { package = "rampsmith-telemetry", path = "crates/telemetry" }
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.3"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.28.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# PLAN §8: denied outside tests (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
# Broader quality bar; CI runs Clippy with -D warnings, so warnings fail the gate.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
