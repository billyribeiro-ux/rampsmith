[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/billyribeiro-ux/rampsmith"

# Versions were read from crates.io on 2026-10-17 (docs/evidence/versions-2026-10-17.md).
# Cargo.lock pins the exact resolution; add a crate here only when a member uses it.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# PLAN §8: denied outside tests (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
# Broader quality bar; CI runs Clippy with -D warnings, so warnings fail the gate.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
