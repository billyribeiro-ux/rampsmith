[package]
name = "rampsmith-github"
version = "0.0.0"
description = "The Rampsmith GitHub App: App JWTs, installation tokens, webhooks, theme guards and the fix pull-request builder."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "github"

# Versions and licenses were read from crates.io on 2026-10-17 (docs/evidence/ws-3-github-app.md).
# Every crate declared directly here is already in Cargo.lock at this exact version (ADR-121).
[dependencies]
# Default features off: they add `untrusted` 0.7, a duplicate under cargo-deny.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"] } # move to [workspace.dependencies] at integration
base64 = "0.23.1" # move to [workspace.dependencies] at integration
hmac = "0.13.0" # move to [workspace.dependencies] at integration
http = "1.5.0" # move to [workspace.dependencies] at integration
opentelemetry.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] } # move to [workspace.dependencies] at integration
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# Default features off: `oid` adds `const-oid`, which nothing here needs.
sha2 = { version = "0.11.1", default-features = false } # move to [workspace.dependencies] at integration
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
url = "2.5.8" # move to [workspace.dependencies] at integration

[dev-dependencies]
axum.workspace = true
proptest = "1.12.0" # move to [workspace.dependencies] at integration
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
