[package]
name = "rampsmith-api"
version = "0.0.0"
description = "The Rampsmith control-plane HTTP API (Axum)."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "api"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
crypto.workspace = true
db.workspace = true
http-kit.workspace = true
identity.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
shopify.workspace = true
shopify-auth.workspace = true
sqlx.workspace = true
telemetry.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
base64.workspace = true
http-body-util.workspace = true
jsonwebtoken.workspace = true
tower.workspace = true
webauthn-authenticator-rs.workspace = true
wiremock.workspace = true

[lints]
workspace = true
