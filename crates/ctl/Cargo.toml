[package]
name = "rampsmith-ctl"
version = "0.0.0"
description = "Rampsmith's Rust-side jobs: Shopify token refresh now, webhooks, writes and pull requests later; plus the leader's reaper and partition maintenance."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "ctl"

[[bin]]
name = "ctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
billing = { package = "rampsmith-billing", path = "../billing" }
contracts.workspace = true
github.workspace = true
crypto.workspace = true
db.workspace = true
domain.workspace = true
queue.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
shopify.workspace = true
shopify-admin.workspace = true
shopify-auth.workspace = true
sqlx.workspace = true
telemetry.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# The fake GitHub API of crates/github's tests is shared (tests/github.rs includes it by path).
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"] }
axum.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
