[package]
name = "rampsmith-egress"
version = "0.0.0"
description = "egress-guard: the forward proxy that keeps the scanning browser on the public internet (PLAN §18)."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "egress"

[[bin]]
name = "egress"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
ipnet.workspace = true
opentelemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
telemetry.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tracing-core.workspace = true

[lints]
workspace = true
