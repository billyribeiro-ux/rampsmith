[package]
name = "rampsmith-rsctl"
version = "0.0.0"
description = "Rampsmith's operator CLI: `rsctl doctor` checks every founder input against its live service, `rsctl keys` generates and rotates master keys."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "rsctl"

[[bin]]
name = "rsctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crypto.workspace = true
db.workspace = true
hmac.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shopify.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
sqlx.workspace = true
domain.workspace = true
aws-lc-rs = "1.18.2"
base64.workspace = true
libtest-mimic = "0.8.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock.workspace = true

# The live checks use their own harness so that a check whose founder input is absent is
# reported as ignored, by name, instead of passing silently (LAUNCH.md section E).
[[test]]
name = "live"
harness = false

[lints]
workspace = true
