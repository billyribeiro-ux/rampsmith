[package]
name = "rampsmith-rsctl"
version = "0.0.0"
description = "Rampsmith's operator CLI: `rsctl doctor` checks every founder input against its live service, `rsctl keys` generates and rotates master keys."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "rsctl"

[[bin]]
name = "rsctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crypto.workspace = true
hmac.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shopify.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-lc-rs = "1.18.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock.workspace = true

[lints]
workspace = true
