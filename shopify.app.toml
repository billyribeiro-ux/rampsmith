# Shopify app configuration (PLAN §14). Shopify-managed installation: scopes live here and are
# requested at install, so there is no OAuth redirect flow (ADR-022).
#
# `client_id` and the URLs are filled in by `shopify app config link` once the founder's
# Partner account and app exist (docs/runbooks/shopify-dev-store.md). The client id is public;
# the client secret never goes in this file.
name = "Rampsmith"
handle = "rampsmith"
client_id = ""
application_url = "https://rampsmith.invalid"
embedded = true

[access_scopes]
# Each scope is justified in PLAN §14; no theme write access, no customer data.
scopes = "read_products,write_products,read_files,write_files,read_themes,read_content,write_content,read_online_store_navigation,write_online_store_navigation,read_locales"
use_legacy_install_flow = false

[auth]
# Required before the app is public; token exchange does not use it.
redirect_urls = ["https://rampsmith.invalid/auth/callback"]

[webhooks]
api_version = "2026-10"

# App-specific subscriptions (ADR-088). Shopify delivers to the webhook host, which reaches the
# api's webhook listener and nothing else of the api (ADR-182), and that listener serves only
# `/webhooks/shopify`. `hooks.rampsmith.invalid` is a placeholder like `application_url`: the
# founder replaces it with the value of RAMPSMITH_WEBHOOK_HOST (LAUNCH.md C row 10) before the
# first `shopify app deploy`, and `infra/railway/tests/test_shopify_app_config.py` fails the
# deploy when the two differ. A relative URI would resolve against `application_url`, which is the
# `web` host and not the webhook host, so the URI is absolute.
[[webhooks.subscriptions]]
topics = ["app/uninstalled", "shop/update"]
uri = "https://hooks.rampsmith.invalid/webhooks/shopify"

# The mandatory privacy topics, as `compliance_topics` (the legacy `[webhooks.privacy_compliance]`
# table cannot be combined with them). Shopify requires these three of every public app, and the
# handler for each is `crates/ctl/src/jobs/webhook.rs`.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://hooks.rampsmith.invalid/webhooks/shopify"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
