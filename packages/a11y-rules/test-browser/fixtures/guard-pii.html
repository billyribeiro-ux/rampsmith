<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Personal-data guard: a gift card form asks for an email</title>
    <!--
      The product form carries an enabled recipient email field, as a gift card form does. The
      script must refuse to submit it. The value is obviously fake.
    -->
  </head>
  <body>
    <main>
      <h1>Gift card</h1>
      <form action="/cart/add" method="post">
        <input type="hidden" name="id" value="40000000009" />
        <label for="r">Recipient email</label>
        <input
          id="r"
          type="email"
          name="properties[Recipient email]"
          value="someone@example.test"
        />
        <button type="submit" name="add">Add to cart</button>
      </form>
    </main>
  </body>
</html>
